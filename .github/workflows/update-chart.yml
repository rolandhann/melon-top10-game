name: Update Melon Chart

on:
  schedule:
    - cron: '0 23 * * *'   # 매일 UTC 23:00 = 한국시간 08:00
  workflow_dispatch:         # GitHub Actions 탭에서 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch chart data
        run: node fetch-chart.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chart-data.json
          git diff --staged --quiet || git commit -m "chore: chart update $(date -u +%Y-%m-%d)"
          git push
